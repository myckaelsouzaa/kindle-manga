<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MangaKindle · Leitor de Mangás</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="logo" data-tab="home">Manga<b>Kindle</b></div>
  <div class="search"><span>🔍</span><input id="q" type="search" placeholder="Buscar mangá (português, 日本語, romaji, inglês)…" autocomplete="off"></div>
  <button class="icon-btn" id="themeBtn" title="Alternar tema">🌙</button>
  <button class="icon-btn" id="avBtn" data-tab="profile" title="Meu perfil">🦊</button>
</header>
<nav>
  <button data-tab="home" class="on">🏠 <span>Início</span></button>
  <button data-tab="saved">🔖 <span>Salvos</span></button>
  <button data-tab="profile">👤 <span>Perfil</span></button>
  <button data-tab="cfg">⚙️ <span>Config.</span></button>
</nav>
<main id="main"></main>
<footer><b>Made by Myckael Andrade <span>♥</span></b><br><small>Data: MangaDex · Jikan · MyMemory</small></footer>
<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>
<div id="reader">
  <div id="prog"><i></i></div>
  <div class="rbar" id="rbar">
    <button class="icon-btn" id="rBack" title="Voltar">←</button>
    <div class="t" id="rTitle"></div>
    <select id="rChap" aria-label="Capítulo"></select>
    <button class="icon-btn" id="rSet" title="Configurações">⚙</button>
  </div>
  <div id="panel">
    <label>Cor de fundo</label>
    <div class="seg" id="sBg">
      <button class="sw" data-rbg="#000000" style="background:#000;border:1px solid #666"></button>
      <button class="sw" data-rbg="#f4ecd8" style="background:#f4ecd8"></button>
      <button class="sw" data-rbg="#ffffff" style="background:#fff"></button>
      <button class="sw" data-rbg="#2b2b2f" style="background:#2b2b2f"></button>
    </div>
    <label>Direção de leitura</label>
    <div class="seg" id="sDir"><button data-rd="h">Horizontal</button><button data-rd="v">Vertical</button></div>
    <label>Brilho das páginas</label><input type="range" id="sBr" min="40" max="120">
    <label>Qualidade das imagens</label>
    <div class="seg" id="sQ"><button data-rq="data-saver">Econômica</button><button data-rq="data">Alta</button></div>
  </div>
  <div id="stage"></div>
  <div class="hud" id="hud"></div>
</div>
<script type="module" src="js/App.js"></script>
</body>
</html>
