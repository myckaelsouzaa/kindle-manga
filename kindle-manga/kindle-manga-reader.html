<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MangaKindle · Leitor de Mangás</title>
<style>
/* ===== Tema ===== */
:root{--bg:#050505;--surface:#111;--surface2:#1a1a1a;--text:#f2f2f2;--muted:#8d8d95;--accent:#00E5FF;--accent2:#ff2bd6;--border:#242428;--radius:14px}
:root[data-theme=light]{--bg:#f5f5f7;--surface:#fff;--surface2:#ececf0;--text:#111;--muted:#666;--accent:#00a6bd;--accent2:#c4009e;--border:#dcdce2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;transition:background .3s,color .3s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%;-webkit-user-drag:none}
::selection{background:var(--accent);color:#000}
.row,.chips,.chlist{scrollbar-width:none}
.row::-webkit-scrollbar,.chips::-webkit-scrollbar,.chlist::-webkit-scrollbar{display:none}
/* ===== Cabeçalho e navegação ===== */
header{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px clamp(12px,4vw,40px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.logo{font-weight:800;font-size:1.2rem;white-space:nowrap;cursor:pointer}
.logo b{color:var(--accent)}
.search{flex:1 1 220px;min-width:0;max-width:640px;margin:0 auto;position:relative}
.search input{width:100%;padding:11px 16px 11px 42px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;outline:0;transition:.2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.search span{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.icon-btn{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--border);background:var(--surface);transition:.2s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
nav{display:flex;justify-content:center;gap:6px;padding:10px 12px 0}
nav button{display:flex;align-items:center;gap:6px;padding:8px 18px;border-radius:999px;font-weight:600;color:var(--muted);transition:.2s}
nav button.on{background:var(--accent);color:#000}
main{flex:1;width:100%;padding:12px clamp(12px,4vw,40px) 40px;max-width:1500px;margin:0 auto}
h2{font-size:clamp(1rem,2.4vw,1.2rem);margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:4px;height:1.1em;background:linear-gradient(var(--accent),var(--accent2));border-radius:4px}
footer{text-align:center;padding:26px 16px;border-top:1px solid var(--border);color:var(--muted);font-size:.85rem}
footer b{color:var(--text)}
footer b span{color:var(--accent2)}
/* ===== Banner (hero) ===== */
.hero{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:21/8;min-height:250px;background:var(--surface);border:1px solid var(--border)}
.slide{position:absolute;inset:0;display:flex;align-items:center;gap:clamp(14px,3vw,36px);padding:clamp(16px,4vw,44px) clamp(16px,4vw,44px) clamp(34px,5vw,50px);opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s;color:#fff}
.slide.on{opacity:1;visibility:visible}
.slide .bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(26px) brightness(.4)}
.slide img,.slide .info{position:relative}
.slide img{height:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;box-shadow:0 12px 40px #000a;flex:none}
.slide .info{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.slide .tag{background:var(--accent2);padding:2px 12px;border-radius:999px;font-size:.75rem;font-weight:700}
.slide h3{font-size:clamp(1.1rem,3vw,2.2rem);line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slide .meta{color:var(--accent);font-size:.85rem}
.slide p{color:#ddd;font-size:.9rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:60ch}
.dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:2}
.dots button{width:8px;height:8px;border-radius:8px;background:#fff6;transition:.3s}
.dots button.on{width:24px;background:var(--accent)}
/* ===== Carrosséis (sem barra de rolagem) ===== */
.car{position:relative}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(118px,26vw,190px);gap:clamp(10px,1.6vw,18px);overflow-x:auto;scroll-snap-type:x proximity;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;padding:4px 2px 8px;cursor:grab}
.row.drag{scroll-snap-type:none;cursor:grabbing;user-select:none}
.row>*{scroll-snap-align:start}
.row .msg{white-space:normal;min-width:min(300px,80vw)}
.nav.l,.nav.r{position:absolute;top:38%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:#000c;color:#fff;font-size:1.5rem;z-index:3;opacity:0;transition:.25s;border:1px solid var(--accent)}
.nav.l{left:-10px}.nav.r{right:-10px}
.car:hover .nav{opacity:1}
@media(hover:none){.nav.l,.nav.r{display:none}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;cursor:grab}
.chip{padding:7px 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface);white-space:nowrap;font-size:.88rem;transition:.2s}
.chip:hover{background:var(--accent);color:#000;border-color:var(--accent)}
/* ===== Cards ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(120px,28vw,180px),1fr));gap:clamp(10px,1.6vw,18px)}
.card{text-align:left;transition:transform .2s;outline:0;min-width:0}
.card:hover,.card:focus-visible{transform:translateY(-4px)}
.cover{position:relative;aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;background:var(--surface2);border:1px solid var(--border)}
.cover img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.cover img.ok{opacity:1}
.card:hover .cover,.card:focus-visible .cover{border-color:var(--accent);box-shadow:0 8px 28px -8px var(--accent)}
.badge{position:absolute;top:8px;left:8px;background:#000c;color:var(--accent);padding:2px 8px;border-radius:8px;font-size:.78rem;font-weight:700}
.fav{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;background:#000b;color:#fff;font-size:1.1rem;line-height:1;z-index:2;transition:.2s}
.fav:hover{transform:scale(1.15)}
.fav.on{color:var(--accent2)}
.bar{position:absolute;bottom:0;left:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.card h3{font-size:.88rem;font-weight:600;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--muted)}
.skel{aspect-ratio:2/3;border-radius:var(--radius);background:linear-gradient(100deg,var(--surface) 30%,var(--surface2) 50%,var(--surface) 70%);background-size:200% 100%;animation:sh 1.2s infinite}
.hero .skel{height:100%;aspect-ratio:auto;border-radius:0}
@keyframes sh{to{background-position:-200% 0}}
.msg{padding:30px;text-align:center;color:var(--muted)}
.msg button,.more{margin-top:10px;padding:8px 20px;border-radius:999px;background:var(--accent);color:#000;font-weight:700}
.more{display:block;margin:24px auto}
/* ===== Configurações ===== */
.box{max-width:560px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.box label,#panel label{display:block;font-size:.75rem;color:var(--muted);margin:14px 0 6px;text-transform:uppercase}
.box label:first-child{margin-top:0}
select{width:100%;padding:9px;border-radius:10px;background:var(--surface2);color:var(--text);border:1px solid var(--border);font:inherit}
.hint{color:var(--muted);font-size:.82rem;margin-top:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--border);font-size:.82rem}
.seg button.on{background:var(--accent);color:#000;border-color:var(--accent)}
/* ===== Modal ===== */
.overlay{position:fixed;inset:0;z-index:50;background:#000b;backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;width:min(900px,100%);max-height:92vh;max-height:92dvh;overflow:auto;display:grid;grid-template-columns:minmax(150px,250px) 1fr;gap:clamp(14px,3vw,24px);padding:clamp(16px,3vw,24px);position:relative;animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:translateY(24px) scale(.96)}}
.modal .x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:var(--surface2);z-index:3}
.modal .cover{position:sticky;top:0;align-self:start}
.modal h1{font-size:clamp(1.2rem,3vw,1.5rem);line-height:1.2;padding-right:34px}
.alt{color:var(--muted);font-size:.85rem;margin-top:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.fact{background:var(--surface2);border-radius:10px;padding:10px 12px;min-width:0}
.fact small{display:block;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.6px}
.fact b{font-weight:600;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tags span{font-size:.75rem;padding:3px 10px;border-radius:999px;border:1px solid var(--accent2);color:var(--accent2)}
.desc{color:var(--muted);max-height:120px;overflow:auto;margin-bottom:14px;font-size:.9rem}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:999px;background:linear-gradient(90deg,var(--accent),#6ee7ff);color:#001;font-weight:800;transition:.2s}
.btn:hover{box-shadow:0 0 24px var(--accent)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn2{padding:12px 20px;border-radius:999px;border:1px solid var(--accent2);color:var(--accent2);font-weight:700}
.btn2.on{background:var(--accent2);color:#fff}
.chlist{margin-top:16px;max-height:200px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.chlist button{padding:6px;border-radius:8px;background:var(--surface2);font-size:.8rem}
.chlist button:hover,.chlist button.cur{background:var(--accent2);color:#fff}
/* ===== Leitor ===== */
#reader{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;background:var(--rbg,#000);height:100vh;height:100dvh}
#reader.open{display:flex}
.rbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#000c;color:#eee;backdrop-filter:blur(10px);z-index:3;transition:transform .3s}
.rbar.hide{transform:translateY(-100%);position:absolute;left:0;right:0}
.rbar .icon-btn{background:#222;border-color:#444;color:#eee;width:38px;height:38px}
.rbar select{width:auto;max-width:36vw;background:#222;color:#eee;border-color:#444;padding:6px}
.rbar .t{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#stage{flex:1;overflow:auto;position:relative;display:flex;justify-content:center;--br:100%}
#stage img{filter:brightness(var(--br))}
#stage.h{align-items:center;overflow:hidden}
#stage.h img{max-height:100%;max-width:100%;object-fit:contain;user-select:none}
#stage.v{flex-direction:column;align-items:center}
#stage.v img{width:min(860px,100%);height:auto;min-height:300px}
.zone{position:absolute;top:0;bottom:0;width:30%;z-index:2;cursor:pointer}
.zone.l{left:0}.zone.r{right:0}.zone.c{left:30%;width:40%}
.hud{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#000b;color:#eee;padding:6px 16px;border-radius:999px;z-index:3;font-size:.82rem;border:1px solid var(--accent);white-space:nowrap;pointer-events:none}
#panel{position:absolute;right:12px;top:58px;z-index:5;width:min(300px,92vw);background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:16px;padding:16px;display:none;box-shadow:0 20px 50px #000a}
#panel.open{display:block}
#panel input[type=range]{width:100%}
.sw{width:32px;height:32px;flex:none!important;border-radius:50%!important;padding:0!important}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
/* ===== Responsivo ===== */
@media(max-width:700px){
  nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  nav button{flex:1;flex-direction:column;gap:0;padding:6px 4px;font-size:.72rem;border-radius:12px}
  footer{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
  .hero{aspect-ratio:auto;height:min(270px,62vw + 60px)}
  .slide p{display:none}
  .overlay{align-items:flex-end;padding:0}
  .modal{grid-template-columns:1fr;border-radius:20px 20px 0 0;width:100%}
  .modal .cover{width:130px;position:static}
  #panel{left:0;right:0;top:auto;bottom:0;width:auto;border-radius:16px 16px 0 0}
}
@media(max-width:420px){.logo span{display:none}.rbar .t{display:none}.rbar select{max-width:none;flex:1}.acts>*{flex:1}}
@media(min-width:1800px){main{max-width:1800px}.row{grid-auto-columns:200px}}
</style>
</head>
<body>
<header>
  <div class="logo">Manga<b>Kindle</b></div>
  <div class="search"><span>🔍</span><input id="q" type="search" placeholder="Buscar mangá (português, 日本語, romaji, inglês)…" autocomplete="off"></div>
  <button class="icon-btn" id="themeBtn" title="Alternar tema">🌙</button>
</header>
<nav>
  <button data-tab="home" class="on">🏠 <span>Início</span></button>
  <button data-tab="fav">♥ <span>Favoritos</span></button>
  <button data-tab="cfg">⚙️ <span>Configurações</span></button>
</nav>
<main id="main"></main>
<footer><b>Made by Myckael Andrade <span>♥</span></b><br><small>Data: MangaDex · Jikan</small></footer>

<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>

<div id="reader">
  <div class="rbar" id="rbar">
    <button class="icon-btn" id="rBack" title="Voltar">←</button>
    <div class="t" id="rTitle"></div>
    <select id="rChap" aria-label="Capítulo"></select>
    <button class="icon-btn" id="rSet" title="Configurações">⚙</button>
  </div>
  <div id="panel">
    <label>Cor de fundo</label>
    <div class="seg" id="sBg">
      <button class="sw" data-c="#000000" style="background:#000;border:1px solid #666"></button>
      <button class="sw" data-c="#f4ecd8" style="background:#f4ecd8"></button>
      <button class="sw" data-c="#ffffff" style="background:#fff"></button>
      <button class="sw" data-c="#2b2b2f" style="background:#2b2b2f"></button>
    </div>
    <label>Direção de leitura</label>
    <div class="seg" id="sDir"><button data-d="h">Horizontal</button><button data-d="v">Vertical</button></div>
    <label>Brilho das páginas</label><input type="range" id="sBr" min="40" max="120">
    <label>Qualidade das imagens</label>
    <div class="seg" id="sQ"><button data-q="data-saver">Econômica</button><button data-q="data">Alta</button></div>
  </div>
  <div id="stage"></div>
  <div class="hud" id="hud"></div>
</div>

<script>
/* =========================================================
   MangaKindle — HTML + CSS + JS puro
   Tudo passa pelo server.js local (a MangaDex bloqueia CORS de outros sites)
   ========================================================= */
const MD = '/md', JK = '/jk';
const img = u => '/img?u=' + encodeURIComponent(u);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};

/* ---------- Idioma (a MangaDex informa os idiomas traduzidos de cada mangá) ---------- */
const LANGS = [['pt-br','Português (Brasil)'],['en','English'],['es-la','Español (Latinoamérica)'],['es','Español (España)'],['fr','Français'],['it','Italiano'],['de','Deutsch'],['ru','Русский'],['id','Bahasa Indonesia']];
const cfg = Object.assign({ lang: 'pt-br' }, store.get('cfg', {}));

/* ---------- Rede com fila (respeita limites: MangaDex ~5/s, Jikan ~3/s) ---------- */
const last = { md: 0, jk: 0 };
async function api(url, tries = 2) {
  const k = url.startsWith(JK) ? 'jk' : 'md', gap = k === 'jk' ? 420 : 240;
  for (let i = 0; i <= tries; i++) {
    const wait = Math.max(0, last[k] + gap - Date.now());
    last[k] = Date.now() + wait;
    await new Promise(r => setTimeout(r, wait));
    try {
      const r = await fetch(url);
      if (r.status === 429) { await new Promise(r => setTimeout(r, 1500 * (i + 1))); continue; }
      if (!r.ok) throw new Error(r.status);
      return await r.json();
    } catch (e) { if (i === tries) throw e; }
  }
  throw new Error('Falha de rede');
}

/* ---------- Dados ---------- */
const pick = o => o && (o[cfg.lang] || o.en || o['ja-ro'] || Object.values(o)[0]) || '';
// Filtra pelo idioma escolhido: só aparecem mangás com capítulos traduzidos nele
const base = () => `includes[]=cover_art&includes[]=author&includes[]=artist&contentRating[]=safe&contentRating[]=suggestive&availableTranslatedLanguage[]=${cfg.lang}&hasAvailableChapters=true`;
function norm(m) {
  const a = m.attributes, rel = t => m.relationships.filter(r => r.type === t);
  const f = rel('cover_art')[0]?.attributes?.fileName, u = s => f ? img(`https://uploads.mangadex.org/covers/${m.id}/${f}${s}`) : '';
  return {
    id: m.id, title: pick(a.title), alts: (a.altTitles || []).map(pick).filter(Boolean),
    desc: pick(a.description), year: a.year, lang: a.originalLanguage, status: a.status,
    tags: (a.tags || []).map(t => t.attributes.name.en), links: a.links || {},
    authors: [...new Set(rel('author').map(r => r.attributes?.name).filter(Boolean))],
    artists: [...new Set(rel('artist').map(r => r.attributes?.name).filter(Boolean))],
    cover: u('.256.jpg'), coverBig: u('.512.jpg'), rating: null
  };
}
async function list(extra) {
  const d = await api(`${MD}/manga?${base()}&${extra}`);
  const items = d.data.map(norm);
  if (items.length) {
    try {
      const s = await api(`${MD}/statistics/manga?${items.map(i => 'manga[]=' + i.id).join('&')}`);
      items.forEach(i => i.rating = s.statistics[i.id]?.rating?.average ?? null);
    } catch {}
  }
  return { items, total: d.total };
}
let TAGS = null;
async function tags() {
  if (!TAGS) TAGS = (await api(`${MD}/manga/tag`)).data.map(t => ({ id: t.id, n: t.attributes.name.en, g: t.attributes.group }));
  return TAGS;
}

/* ---------- Favoritos ---------- */
const cache = {};
const favs = () => store.get('fav', {});
const isFav = id => !!favs()[id];
function toggleFav(id) {
  const f = favs(), m = cache[id]; if (!m) return;
  f[id] ? delete f[id] : f[id] = m;
  store.set('fav', f);
  const on = !!f[id];
  document.querySelectorAll(`[data-fav="${id}"]`).forEach(b => {
    b.classList.toggle('on', on);
    b.textContent = b.dataset.full ? (on ? '♥ Favoritado' : '♡ Favoritar') : (on ? '♥' : '♡');
  });
  if (tab === 'fav') favView();
}

/* ---------- Cards e carrosséis ---------- */
function card(m) {
  cache[m.id] = m;
  const p = store.get('progress', {})[m.id], f = isFav(m.id);
  return `<div class="card" data-id="${m.id}" tabindex="0" role="button"><div class="cover"><img loading="lazy" draggable="false" alt="Capa de ${esc(m.title)}" src="${m.cover}" onload="this.classList.add('ok')">
    ${m.rating ? `<span class="badge">★ ${m.rating.toFixed(1)}</span>` : ''}
    <button class="fav ${f ? 'on' : ''}" data-fav="${m.id}" aria-label="Favoritar">${f ? '♥' : '♡'}</button></div>
    <h3>${esc(m.title)}</h3>${p ? `<small>Cap. ${esc(p.chNum)} · pág. ${p.page}</small>` : ''}</div>`;
}
const skeleton = n => '<div class="skel"></div>'.repeat(n);
const car = inner => `<div class="car"><button class="nav l" data-dir="-1" aria-label="Anterior">‹</button><div class="row">${inner}</div><button class="nav r" data-dir="1" aria-label="Próximo">›</button></div>`;
const errBox = fn => `<div class="msg">Não foi possível carregar os dados.<br><button onclick="${fn}">Tentar novamente</button></div>`;

/* Arrastar com o mouse nos carrosséis (no toque a rolagem já é nativa) */
let drag = null, suppress = false;
document.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse') return;
  const r = e.target.closest('.row,.chips'); if (r) drag = { r, x: e.clientX, s: r.scrollLeft, m: false };
});
addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 6) { drag.m = true; drag.r.classList.add('drag'); }
  if (drag.m) drag.r.scrollLeft = drag.s - dx;
});
addEventListener('pointerup', () => {
  if (drag?.m) { suppress = true; setTimeout(() => suppress = false, 0); }
  drag?.r.classList.remove('drag'); drag = null;
});

/* ---------- Navegação ---------- */
let tab = 'home', heroT;
function setTab(t) {
  tab = t; clearInterval(heroT); scrollTo(0, 0);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
}
const views = { home: () => home(), fav: () => favView(), cfg: () => settingsView() };
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { $('#q').value = ''; views[b.dataset.tab](); });

/* ---------- Início ---------- */
const GEN_PT = { Action: 'Ação', Adventure: 'Aventura', Comedy: 'Comédia', Drama: 'Drama', Fantasy: 'Fantasia', Horror: 'Terror', Mystery: 'Mistério', Romance: 'Romance', 'Sci-Fi': 'Ficção científica', 'Slice of Life': 'Cotidiano', Sports: 'Esportes', Psychological: 'Psicológico', Supernatural: 'Sobrenatural', Historical: 'Histórico', Thriller: 'Suspense', Tragedy: 'Tragédia', Magic: 'Magia', Crime: 'Crime', Superhero: 'Super-herói', Music: 'Música', Mecha: 'Mecha', Isekai: 'Isekai' };
// [título, consulta, nome da tag (opcional)]
const SECS = [
  ['🔥 Em alta', 'order[followedCount]=desc'],
  ['⭐ Mais bem avaliados', 'order[rating]=desc'],
  ['🆕 Atualizados recentemente', 'order[latestUploadedChapter]=desc'],
  ['✨ Novos no catálogo', 'order[createdAt]=desc'],
  ['⚔️ Ação', '', 'Action'], ['💕 Romance', '', 'Romance'], ['😂 Comédia', '', 'Comedy'],
  ['🧙 Fantasia', '', 'Fantasy'], ['👻 Terror', '', 'Horror'], ['🚀 Ficção científica', '', 'Sci-Fi'],
  ['🍃 Cotidiano', '', 'Slice of Life'], ['✅ Obras completas', 'status[]=completed&order[followedCount]=desc']
];
const secIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { secIO.unobserve(e.target); fillSec(e.target); } }), { rootMargin: '500px' });

async function home() {
  setTab('home'); secIO.disconnect();
  const prog = Object.values(store.get('progress', {})).sort((a, b) => b.ts - a.ts);
  $('#main').innerHTML = `<div class="hero" id="hero"><div class="skel"></div></div>` +
    (prog.length ? `<h2>📖 Continuar lendo</h2>${car(prog.map(p => { cache[p.id] = cache[p.id] || p.manga;
      return `<div class="card" data-id="${p.id}" tabindex="0" role="button"><div class="cover"><img src="${esc(p.manga.cover)}" alt="" class="ok" loading="lazy" draggable="false"><div class="bar" style="width:${Math.min(100, p.page / p.total * 100)}%"></div></div><h3>${esc(p.manga.title)}</h3><small>Cap. ${esc(p.chNum)} · pág. ${p.page}/${p.total}</small></div>`; }).join(''))}` : '') +
    `<h2>Gêneros</h2><div class="chips" id="genres"></div>` +
    SECS.map((s, i) => `<section data-i="${i}"><h2>${s[0]}</h2>${car(skeleton(8))}</section>`).join('');
  loadGenres();
  const secs = document.querySelectorAll('section[data-i]');
  fillSec(secs[0]); secs.forEach((s, i) => i && secIO.observe(s)); // a 1ª carrega já e alimenta o banner
}
async function fillSec(el) {
  const s = SECS[el.dataset.i], row = el.querySelector('.row');
  try {
    let q = s[1];
    if (s[2]) { const t = (await tags()).find(x => x.n === s[2]); if (!t) return el.remove(); q = `includedTags[]=${t.id}&order[followedCount]=desc`; }
    const { items } = await list(q + '&limit=20');
    if (!items.length) { el.remove(); if (el.dataset.i === '0') { $('#hero')?.remove(); } return; }
    row.innerHTML = items.map(card).join('');
    if (el.dataset.i === '0') hero(items);
  } catch { row.innerHTML = errBox('home()'); if (el.dataset.i === '0') $('#hero')?.remove(); }
}
async function loadGenres() {
  const box = $('#genres');
  try {
    box.innerHTML = (await tags()).filter(t => t.g === 'genre').sort((a, b) => a.n.localeCompare(b.n))
      .map(t => `<button class="chip" data-tag="${t.id}" data-n="${esc(GEN_PT[t.n] || t.n)}">${esc(GEN_PT[t.n] || t.n)}</button>`).join('');
  } catch { box.remove(); }
}

/* ---------- Banner de destaques ---------- */
function hero(items) {
  const box = $('#hero'); if (!box) return;
  const L = items.filter(i => i.desc).slice(0, 6); if (!L.length) return box.remove();
  L.forEach(m => cache[m.id] = m);
  box.innerHTML = L.map((m, i) => `<div class="slide ${i ? '' : 'on'}"><div class="bg" style="background-image:url('${m.coverBig}')"></div>
    <img src="${m.coverBig}" alt="Capa de ${esc(m.title)}" draggable="false"><div class="info"><span class="tag">🔥 Destaque ${i + 1}</span>
    <h3>${esc(m.title)}</h3><div class="meta">${m.rating ? '★ ' + m.rating.toFixed(1) + ' · ' : ''}${esc(m.tags.slice(0, 3).map(t => GEN_PT[t] || t).join(' · '))}</div>
    <p>${esc(m.desc)}</p><button class="btn" data-id="${m.id}">Ver detalhes</button></div></div>`).join('') +
    `<div class="dots">${L.map((_, i) => `<button data-dot="${i}" class="${i ? '' : 'on'}" aria-label="Destaque ${i + 1}"></button>`).join('')}</div>`;
  let cur = 0;
  const show = n => { cur = (n + L.length) % L.length;
    box.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('on', i === cur));
    box.querySelectorAll('.dots button').forEach((d, i) => d.classList.toggle('on', i === cur)); };
  const play = () => { clearInterval(heroT); heroT = setInterval(() => show(cur + 1), 6500); };
  box.addEventListener('click', e => { const d = e.target.closest('[data-dot]'); if (d) { show(+d.dataset.dot); play(); } });
  box.onmouseenter = () => clearInterval(heroT); box.onmouseleave = play;
  let x0 = 0;
  box.ontouchstart = e => x0 = e.touches[0].clientX;
  box.ontouchend = e => { const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) { show(cur + (dx < 0 ? 1 : -1)); play(); } };
  play();
}

/* ---------- Grade paginada (busca / gênero) ---------- */
async function gridView(title, extra) {
  setTab('home'); let off = 0;
  $('#main').innerHTML = `<h2>${title}</h2><div class="grid" id="g">${skeleton(12)}</div><div id="mm"></div>`;
  const load = async () => {
    try {
      const { items, total } = await list(`${extra}&limit=24&offset=${off}`);
      const g = $('#g'); if (!off) g.innerHTML = '';
      if (!items.length && !off) { g.innerHTML = '<div class="msg">Nenhum mangá encontrado neste idioma.</div>'; return; }
      g.insertAdjacentHTML('beforeend', items.map(card).join(''));
      off += 24; $('#mm').innerHTML = off < total ? '<button class="more">Carregar mais</button>' : '';
      $('#mm .more')?.addEventListener('click', e => { e.target.textContent = 'Carregando…'; load(); });
    } catch { $('#g').innerHTML = errBox('location.reload()'); }
  };
  load();
}
let tmr;
$('#q').addEventListener('input', e => {
  clearTimeout(tmr); const v = e.target.value.trim();
  tmr = setTimeout(() => v.length < 2 ? home() : gridView(`Resultados para “${esc(v)}”`, `title=${encodeURIComponent(v)}&order[relevance]=desc`), 450);
});

/* ---------- Favoritos e Configurações ---------- */
function favView() {
  setTab('fav');
  const f = Object.values(favs());
  $('#main').innerHTML = `<h2>♥ Favoritos</h2>` + (f.length ? `<div class="grid">${f.map(card).join('')}</div>`
    : '<div class="msg">Você ainda não favoritou nenhum mangá.<br>Toque no ♡ de qualquer capa para salvar aqui.</div>');
}
function settingsView() {
  setTab('cfg');
  $('#main').innerHTML = `<h2>Configurações</h2><div class="box">
    <label for="cLang">Idioma dos mangás</label>
    <select id="cLang">${LANGS.map(([c, n]) => `<option value="${c}" ${c === cfg.lang ? 'selected' : ''}>${n}</option>`).join('')}</select>
    <p class="hint" id="cHint">Somente mangás com capítulos traduzidos neste idioma aparecem na busca, nas categorias e na leitura.</p>
    <label>Tema</label><div class="seg" id="cTheme"><button data-t="dark">Escuro</button><button data-t="light">Claro</button></div>
    <label>Dados salvos neste navegador</label>
    <div class="seg"><button id="clrProg">Limpar histórico de leitura</button><button id="clrFav">Limpar favoritos</button></div></div>`;
  const mark = () => document.querySelectorAll('#cTheme button').forEach(b => b.classList.toggle('on', b.dataset.t === document.documentElement.dataset.theme));
  mark();
  $('#cLang').onchange = e => { cfg.lang = e.target.value; store.set('cfg', cfg); $('#cHint').textContent = '✓ Idioma salvo. Volte ao Início para ver o catálogo atualizado.'; };
  $('#cTheme').onclick = e => { const b = e.target.closest('button'); if (b) { setTheme(b.dataset.t); mark(); } };
  $('#clrProg').onclick = e => { store.set('progress', {}); e.target.textContent = '✓ Histórico limpo'; };
  $('#clrFav').onclick = e => { store.set('fav', {}); e.target.textContent = '✓ Favoritos limpos'; };
}

/* ---------- Cliques (delegação) ---------- */
document.addEventListener('click', e => {
  if (suppress) return;
  const fv = e.target.closest('[data-fav]'); if (fv) return toggleFav(fv.dataset.fav);
  const nv = e.target.closest('.nav');
  if (nv) { const r = nv.parentElement.querySelector('.row'); return r.scrollBy({ left: +nv.dataset.dir * r.clientWidth * .85, behavior: 'smooth' }); }
  const t = e.target.closest('.chip');
  if (t) return gridView('Gênero: ' + esc(t.dataset.n), `includedTags[]=${t.dataset.tag}&order[followedCount]=desc`);
  const c = e.target.closest('[data-id]'); if (c) return openModal(c.dataset.id);
  if (e.target.closest('.logo')) { $('#q').value = ''; home(); }
});

/* ---------- Modal de detalhes ---------- */
const COUNTRY = { ja: '🇯🇵 Japão', ko: '🇰🇷 Coreia do Sul', zh: '🇨🇳 China', 'zh-hk': '🇭🇰 Hong Kong', en: '🇺🇸 EUA/Reino Unido' };
const STATUS = { ongoing: 'Em andamento', completed: 'Completo', hiatus: 'Em hiato', cancelled: 'Cancelado' };
const fact = (k, v, id = '') => `<div class="fact"><small>${k}</small><b ${id ? `id="${id}"` : ''}>${v}</b></div>`;

async function openModal(id) {
  const m = cache[id]; if (!m) return;
  const prog = store.get('progress', {})[id], f = isFav(id);
  $('#modal').innerHTML = `<button class="x" onclick="closeModal()" aria-label="Fechar">✕</button>
    <div class="cover"><img class="ok" alt="" src="${m.cover}"></div>
    <div><h1>${esc(m.title)}</h1><div class="alt">${esc(m.alts.slice(0, 3).join(' · '))}</div>
    <div class="facts">
      ${fact('Nota dos usuários', m.rating ? '★ ' + m.rating.toFixed(2) + ' / 10' : '—', 'fRate')}
      ${fact('Formato', m.tags.includes('Full Color') ? '🎨 Colorido' : '⬛ Preto e branco')}
      ${fact('País de origem', COUNTRY[m.lang] || esc(m.lang))}
      ${fact('Autor(es)', esc(m.authors.join(', ') || '—'))}
      ${fact('Arte', esc(m.artists.join(', ') || '—'))}
      ${fact('Revista / Editora', '…', 'fMag')}
      ${fact('Ano de criação', m.year || '—')}
      ${fact('Publicação', STATUS[m.status] || '—', 'fPub')}
      ${fact('Capítulos', '…', 'fCh')}
    </div>
    <div class="tags">${m.tags.slice(0, 8).map(t => `<span>${esc(GEN_PT[t] || t)}</span>`).join('')}</div>
    <div class="desc">${esc(m.desc || 'Sem sinopse disponível.')}</div>
    <div class="acts"><button class="btn" id="readBtn" disabled>Carregando capítulos…</button>
    <button class="btn2 ${f ? 'on' : ''}" data-fav="${id}" data-full="1">${f ? '♥ Favoritado' : '♡ Favoritar'}</button></div>
    <div class="chlist" id="chl"></div></div>`;
  $('#ov').classList.add('open'); document.body.style.overflow = 'hidden';

  loadChapters(m).then(chs => {
    $('#fCh').textContent = chs.length;
    const b = $('#readBtn');
    if (!chs.length) { b.textContent = 'Sem capítulos neste idioma'; return; }
    const pi = prog ? Math.max(0, chs.findIndex(c => c.id === prog.chId)) : 0;
    b.disabled = false;
    b.textContent = prog ? `▶ Continuar · Cap. ${chs[pi].num}, pág. ${prog.page}` : '▶ Começar a ler';
    b.onclick = () => openReader(m, chs, pi, prog ? prog.page : 1);
    $('#chl').innerHTML = chs.map((c, i) => `<button class="${prog && i === pi ? 'cur' : ''}" data-i="${i}">Cap. ${esc(c.num)}</button>`).join('');
    $('#chl').onclick = e => { const x = e.target.closest('button'); if (x) openReader(m, chs, +x.dataset.i, 1); };
  }).catch(() => { $('#readBtn').textContent = 'Erro ao carregar capítulos'; });
  extra(m);
}
function closeModal() { $('#ov').classList.remove('open'); document.body.style.overflow = ''; }
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov') closeModal(); });

/* Revista/editora via Jikan (MyAnimeList) */
async function extra(m) {
  const set = (id, v) => { const el = $('#' + id); if (el) el.textContent = v; };
  try {
    let mal = m.links.mal;
    if (!mal) mal = (await api(`${JK}/manga?q=${encodeURIComponent(m.title)}&limit=1`, 1)).data[0]?.mal_id;
    if (!mal) throw 0;
    const { data } = await api(`${JK}/manga/${mal}/full`, 1);
    set('fMag', data.serializations?.map(s => s.name).join(', ') || 'Não informado');
    if (!m.year && data.published?.prop?.from?.year) set('fPub', data.published.prop.from.year);
    if (data.score && !m.rating) set('fRate', '★ ' + data.score + ' / 10 (MAL)');
  } catch { set('fMag', 'Não informado'); }
}

/* ---------- Capítulos (apenas no idioma escolhido) ---------- */
async function loadChapters(m) {
  const out = []; let off = 0, total = 1;
  while (off < total && off < 3000) {
    const d = await api(`${MD}/manga/${m.id}/feed?translatedLanguage[]=${cfg.lang}&order[chapter]=asc&limit=500&offset=${off}&includeExternalUrl=0&contentRating[]=safe&contentRating[]=suggestive`);
    total = d.total; off += 500;
    d.data.forEach(c => c.attributes.pages > 0 && out.push({ id: c.id, num: c.attributes.chapter || 'Oneshot' }));
  }
  const seen = new Set();
  return out.filter(c => !seen.has(c.num) && seen.add(c.num)); // remove duplicatas de grupos
}

/* ---------- Leitor (só opções que afetam o mangá: fundo, direção, brilho, qualidade) ---------- */
const S = Object.assign({ bg: '#000000', dir: 'h', q: 'data-saver', br: 100 }, store.get('settings', {}));
const R = { m: null, chs: [], i: 0, pages: [], p: 1, io: null };

function applySettings() {
  const r = $('#reader').style;
  r.setProperty('--rbg', S.bg); $('#stage').style.setProperty('--br', S.br + '%'); $('#sBr').value = S.br;
  document.querySelectorAll('#sBg button').forEach(b => b.classList.toggle('on', b.dataset.c === S.bg));
  document.querySelectorAll('#sDir button').forEach(b => b.classList.toggle('on', b.dataset.d === S.dir));
  document.querySelectorAll('#sQ button').forEach(b => b.classList.toggle('on', b.dataset.q === S.q));
  store.set('settings', S);
}
function openReader(m, chs, i, page = 1) {
  closeModal(); Object.assign(R, { m, chs, i });
  $('#reader').classList.add('open'); document.body.style.overflow = 'hidden';
  $('#rbar').classList.remove('hide'); $('#rTitle').textContent = m.title;
  $('#rChap').innerHTML = chs.map((c, k) => `<option value="${k}">Cap. ${esc(c.num)}</option>`).join('');
  applySettings(); loadChapterPages(page);
}
async function loadChapterPages(page = 1) {
  const st = $('#stage'); $('#rChap').value = R.i; st.className = S.dir;
  st.innerHTML = '<div class="msg">Carregando páginas…</div>';
  try {
    const d = await api(`${MD}/at-home/server/${R.chs[R.i].id}`);
    const c = d.chapter, files = S.q === 'data' ? c.data : c.dataSaver;
    R.pages = files.map(f => img(`${d.baseUrl}/${S.q}/${c.hash}/${f}`));
    R.p = Math.min(Math.max(1, page), R.pages.length);
    renderPages();
  } catch { st.innerHTML = errBox('loadChapterPages()'); }
}
function renderPages() {
  const st = $('#stage'); st.className = S.dir; R.io?.disconnect();
  if (S.dir === 'h') { // estilo Kindle: uma página por vez
    st.innerHTML = '<div class="zone l"></div><div class="zone c"></div><div class="zone r"></div><img alt="">';
    st.querySelector('.l').onclick = () => go(-1); st.querySelector('.r').onclick = () => go(1);
    st.querySelector('.c').onclick = () => $('#rbar').classList.toggle('hide');
    showPage();
  } else { // webtoon: rolagem contínua
    st.innerHTML = R.pages.map((u, k) => `<img loading="lazy" data-p="${k + 1}" src="${u}" alt="Página ${k + 1}">`).join('') + '<button class="more" id="nextCh">Próximo capítulo →</button>';
    $('#nextCh').onclick = () => changeCh(1);
    R.io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { R.p = +e.target.dataset.p; save(); hud(); } }), { root: st, threshold: .5 });
    st.querySelectorAll('img').forEach(i => R.io.observe(i));
    st.querySelector(`img[data-p="${R.p}"]`)?.scrollIntoView();
  }
  hud(); save();
}
function showPage() {
  const im = $('#stage img'); if (!im) return;
  im.style.opacity = .3; im.src = R.pages[R.p - 1]; im.onload = () => im.style.opacity = 1;
  [1, 2].forEach(n => { if (R.pages[R.p - 1 + n]) new Image().src = R.pages[R.p - 1 + n]; });
  hud(); save();
}
function go(d) {
  if (S.dir === 'v') return $('#stage').scrollBy({ top: d * innerHeight * .85, behavior: 'smooth' });
  const n = R.p + d;
  if (n < 1) return changeCh(-1, true);
  if (n > R.pages.length) return changeCh(1);
  R.p = n; showPage();
}
function changeCh(d, last) { const n = R.i + d; if (n >= 0 && n < R.chs.length) { R.i = n; loadChapterPages(last ? 9999 : 1); } }
const hud = () => $('#hud').textContent = `Cap. ${R.chs[R.i]?.num} · Página ${R.p} / ${R.pages.length}`;
let svT;
function save() { // progresso: mangá, capítulo e página
  clearTimeout(svT);
  svT = setTimeout(() => {
    const p = store.get('progress', {});
    p[R.m.id] = { id: R.m.id, manga: R.m, chId: R.chs[R.i].id, chNum: R.chs[R.i].num, page: R.p, total: R.pages.length, ts: Date.now() };
    store.set('progress', p);
  }, 250);
}
function closeReader() {
  R.io?.disconnect(); $('#reader').classList.remove('open'); $('#panel').classList.remove('open');
  document.body.style.overflow = ''; views[tab]();
}
$('#rBack').onclick = closeReader;
$('#rSet').onclick = () => $('#panel').classList.toggle('open');
$('#rChap').onchange = e => { R.i = +e.target.value; loadChapterPages(1); };
$('#sBr').oninput = e => { S.br = +e.target.value; applySettings(); };
$('#sBg').onclick = e => { const b = e.target.closest('button'); if (b) { S.bg = b.dataset.c; applySettings(); } };
$('#sDir').onclick = e => { const b = e.target.closest('button'); if (b) { S.dir = b.dataset.d; applySettings(); renderPages(); } };
$('#sQ').onclick = e => { const b = e.target.closest('button'); if (b) { S.q = b.dataset.q; applySettings(); loadChapterPages(R.p); } };
let tx = 0; // deslizar o dedo para virar a página
$('#stage').addEventListener('touchstart', e => tx = e.touches[0].clientX, { passive: true });
$('#stage').addEventListener('touchend', e => { if (S.dir !== 'h') return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); }, { passive: true });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList?.contains('card')) return openModal(e.target.dataset.id);
  if (e.key === 'Escape') return $('#reader').classList.contains('open') ? closeReader() : closeModal();
  if (!$('#reader').classList.contains('open') || S.dir === 'v') return;
  if (['ArrowRight', ' '].includes(e.key)) go(1);
  if (e.key === 'ArrowLeft') go(-1);
});

/* ---------- Tema ---------- */
function setTheme(t) { document.documentElement.dataset.theme = t; $('#themeBtn').textContent = t === 'dark' ? '🌙' : '☀️'; store.set('theme', t); }
$('#themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
setTheme(store.get('theme', 'dark'));

home();
</script>
