<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MangaKindle · Leitor de Mangás</title>
<style>
/* ===== Tema (variáveis) ===== */
:root{--bg:#050505;--surface:#111;--surface2:#1a1a1a;--text:#f2f2f2;--muted:#8d8d95;--accent:#00E5FF;--accent2:#ff2bd6;--border:#242428;--radius:14px}
:root[data-theme=light]{--bg:#f5f5f7;--surface:#fff;--surface2:#ececf0;--text:#111;--muted:#666;--accent:#00a6bd;--accent2:#c4009e;--border:#dcdce2}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;transition:background .3s,color .3s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
::selection{background:var(--accent);color:#000}
/* ===== Cabeçalho ===== */
header{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;padding:12px clamp(12px,4vw,40px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.logo{font-weight:800;font-size:1.2rem;letter-spacing:.5px;white-space:nowrap}
.logo b{color:var(--accent)}
.search{flex:1;position:relative;max-width:640px;margin:0 auto}
.search input{width:100%;padding:11px 16px 11px 42px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;outline:0;transition:.2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.search span{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:1.1rem;transition:.2s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
main{padding:20px clamp(12px,4vw,40px) 60px;max-width:1500px;margin:auto}
h2{font-size:1.15rem;margin:28px 0 14px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:4px;height:1.1em;background:linear-gradient(var(--accent),var(--accent2));border-radius:4px}
/* ===== Gêneros ===== */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chip{padding:7px 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface);white-space:nowrap;font-size:.88rem;transition:.2s}
.chip:hover,.chip.on{background:var(--accent);color:#000;border-color:var(--accent)}
/* ===== Cards ===== */
.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(140px,170px);gap:14px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity;scrollbar-width:thin}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{scroll-snap-align:start;text-align:left;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.cover{position:relative;aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;background:var(--surface2);border:1px solid var(--border)}
.cover img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.cover img.ok{opacity:1}
.card:hover .cover{border-color:var(--accent);box-shadow:0 8px 28px -8px var(--accent)}
.badge{position:absolute;top:8px;left:8px;background:#000c;color:var(--accent);padding:2px 8px;border-radius:8px;font-size:.78rem;font-weight:700;backdrop-filter:blur(6px)}
.bar{position:absolute;bottom:0;left:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.card h3{font-size:.88rem;font-weight:600;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--muted)}
.skel{aspect-ratio:2/3;border-radius:var(--radius);background:linear-gradient(100deg,var(--surface) 30%,var(--surface2) 50%,var(--surface) 70%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.msg{padding:30px;text-align:center;color:var(--muted)}
.msg button{margin-top:10px;padding:8px 18px;border-radius:999px;background:var(--accent);color:#000;font-weight:700}
.more{display:block;margin:24px auto;padding:10px 26px;border-radius:999px;border:1px solid var(--accent);color:var(--accent)}
/* ===== Modal ===== */
.overlay{position:fixed;inset:0;z-index:50;background:#000b;backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;width:min(900px,100%);max-height:92vh;overflow:auto;display:grid;grid-template-columns:260px 1fr;gap:24px;padding:24px;position:relative;animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.94) translateY(20px)}}
.modal .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:var(--surface2)}
.modal .cover{position:sticky;top:0;align-self:start}
.modal h1{font-size:1.5rem;line-height:1.2;padding-right:30px}
.alt{color:var(--muted);font-size:.85rem;margin-top:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:16px 0}
.fact{background:var(--surface2);border-radius:10px;padding:10px 12px}
.fact small{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.6px}
.fact b{font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tags span{font-size:.75rem;padding:3px 10px;border-radius:999px;border:1px solid var(--accent2);color:var(--accent2)}
.desc{color:var(--muted);max-height:120px;overflow:auto;margin-bottom:14px;font-size:.9rem}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 26px;border-radius:999px;background:linear-gradient(90deg,var(--accent),#6ee7ff);color:#001;font-weight:800;transition:.2s}
.btn:hover{box-shadow:0 0 24px var(--accent);transform:scale(1.03)}
.btn:disabled{opacity:.4;pointer-events:none}
.chlist{margin-top:16px;max-height:200px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.chlist button{padding:6px;border-radius:8px;background:var(--surface2);font-size:.8rem}
.chlist button:hover,.chlist button.cur{background:var(--accent2);color:#fff}
/* ===== Leitor ===== */
#reader{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;background:var(--rbg,#000);color:var(--rfg,#eee);font-family:var(--rfont,system-ui);font-size:var(--rsize,16px)}
#reader.open{display:flex}
.rbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#000a;color:#eee;backdrop-filter:blur(10px);z-index:3;transition:transform .3s}
.rbar.hide{transform:translateY(-100%);position:absolute;left:0;right:0}
.rbar select{background:#222;color:#eee;border:1px solid #444;border-radius:8px;padding:6px;max-width:40vw;font:inherit}
.rbar .t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--rfg)}
#stage{flex:1;overflow:auto;position:relative;display:flex;justify-content:center}
#stage.h{align-items:center;overflow:hidden}
#stage.h img{max-height:100%;max-width:100%;object-fit:contain;user-select:none}
#stage.v{flex-direction:column;align-items:center}
#stage.v img{width:min(860px,100%);height:auto;min-height:300px}
.zone{position:absolute;top:0;bottom:0;width:30%;z-index:2;cursor:pointer}
.zone.l{left:0}.zone.r{right:0}.zone.c{left:30%;width:40%}
.hud{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#000a;color:var(--rfg);padding:6px 16px;border-radius:999px;z-index:3;font-size:.85em;border:1px solid var(--accent)}
#panel{position:absolute;right:12px;top:58px;z-index:5;width:min(300px,92vw);background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:16px;padding:16px;display:none;box-shadow:0 20px 50px #000a}
#panel.open{display:block}
#panel label{display:block;font-size:.75rem;color:var(--muted);margin:10px 0 4px;text-transform:uppercase}
#panel select,#panel input[type=range]{width:100%}
#panel select{padding:7px;border-radius:8px;background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:7px;border-radius:8px;border:1px solid var(--border);font-size:.8rem}
.seg button.on{background:var(--accent);color:#000;border-color:var(--accent)}
.sw{width:30px!important;flex:none!important;height:30px;border-radius:50%!important}
@media(max-width:700px){.modal{grid-template-columns:1fr}.modal .cover{width:150px;position:static}.logo span{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo">Manga<b>Kindle</b><span> ▮</span></div>
  <div class="search"><span>🔍</span><input id="q" type="search" placeholder="Buscar mangá (português, 日本語, romaji, inglês)…" autocomplete="off"></div>
  <button class="icon-btn" id="themeBtn" title="Alternar tema">🌙</button>
</header>
<main id="main"></main>

<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>

<div id="reader">
  <div class="rbar" id="rbar">
    <button class="icon-btn" id="rBack" title="Voltar">←</button>
    <div class="t" id="rTitle"></div>
    <select id="rChap" aria-label="Capítulo"></select>
    <button class="icon-btn" id="rSet" title="Configurações">Aa</button>
  </div>
  <div id="panel">
    <label>Fonte (textos do leitor)</label>
    <select id="sFont"><option value="Georgia,serif">Serifada</option><option value="system-ui,sans-serif">Sem serifa</option><option value="ui-monospace,Menlo,monospace">Monoespaçada</option></select>
    <label>Tamanho do texto</label><input type="range" id="sSize" min="12" max="26">
    <label>Cor do texto</label><input type="color" id="sColor">
    <label>Cor de fundo</label>
    <div class="seg" id="sBg">
      <button class="sw" data-c="#000000" style="background:#000;border:1px solid #666"></button>
      <button class="sw" data-c="#f4ecd8" style="background:#f4ecd8"></button>
      <button class="sw" data-c="#ffffff" style="background:#fff"></button>
      <button class="sw" data-c="#2b2b2f" style="background:#2b2b2f"></button>
    </div>
    <label>Direção de leitura</label>
    <div class="seg" id="sDir"><button data-d="h">Horizontal</button><button data-d="v">Vertical</button></div>
    <label>Qualidade das imagens</label>
    <div class="seg" id="sQ"><button data-q="data-saver">Econômica</button><button data-q="data">Alta</button></div>
  </div>
  <div id="stage"></div>
  <div class="hud" id="hud"></div>
</div>

<script>
/* =========================================================
   MangaKindle — leitor de mangás (HTML + CSS + JS puro)
   APIs: MangaDex (catálogo/capítulos) e Jikan (metadados MAL)
   ========================================================= */
/* Tudo passa pelo server.js local (a MangaDex não permite CORS de outros sites) */
const MD = '/md', JK = '/jk';
const img = u => '/img?u=' + encodeURIComponent(u);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};

/* ---------- Rede ---------- */
/* Fetch com fila: limita o ritmo para não tomar 429/ban da MangaDex (~5 req/s) e da Jikan (~3 req/s) */
const last = { md: 0, jk: 0 };
async function api(url, tries = 2) {
  const k = url.startsWith(JK) ? 'jk' : 'md', gap = k === 'jk' ? 420 : 240;
  for (let i = 0; i <= tries; i++) {
    const wait = Math.max(0, last[k] + gap - Date.now());
    last[k] = Date.now() + wait;
    await new Promise(r => setTimeout(r, wait));
    try {
      const r = await fetch(url);
      if (r.status === 429) { await new Promise(r => setTimeout(r, 1500 * (i + 1))); continue; }
      if (!r.ok) throw new Error(r.status);
      return await r.json();
    } catch (e) { if (i === tries) throw e; }
  }
  throw new Error('Falha de rede');
}

/* ---------- Normalização dos dados da MangaDex ---------- */
const pick = o => o && (o['pt-br'] || o.en || o['ja-ro'] || Object.values(o)[0]) || '';
const BASE = 'includes[]=cover_art&includes[]=author&includes[]=artist&contentRating[]=safe&contentRating[]=suggestive&availableTranslatedLanguage[]=pt-br&availableTranslatedLanguage[]=en&hasAvailableChapters=true';
function norm(m) {
  const a = m.attributes, rel = t => m.relationships.filter(r => r.type === t);
  const f = rel('cover_art')[0]?.attributes?.fileName;
  return {
    id: m.id, title: pick(a.title), alts: (a.altTitles || []).map(pick).filter(Boolean),
    desc: pick(a.description), year: a.year, lang: a.originalLanguage, status: a.status,
    tags: (a.tags || []).map(t => t.attributes.name.en), links: a.links || {},
    authors: [...new Set(rel('author').map(r => r.attributes?.name).filter(Boolean))],
    artists: [...new Set(rel('artist').map(r => r.attributes?.name).filter(Boolean))],
    cover: f ? img(`https://uploads.mangadex.org/covers/${m.id}/${f}.256.jpg`) : '', rating: null
  };
}
async function list(extra) {
  const d = await api(`${MD}/manga?${BASE}&${extra}`);
  const items = d.data.map(norm);
  if (items.length) { // notas em lote
    try {
      const s = await api(`${MD}/statistics/manga?${items.map(i => 'manga[]=' + i.id).join('&')}`);
      items.forEach(i => i.rating = s.statistics[i.id]?.rating?.average ?? null);
    } catch {}
  }
  return { items, total: d.total };
}

/* ---------- Cards ---------- */
const cache = {};
function card(m) {
  cache[m.id] = m;
  const p = store.get('progress', {})[m.id];
  return `<button class="card" data-id="${m.id}">
    <div class="cover"><img loading="lazy" alt="Capa de ${esc(m.title)}" src="${m.cover}" onload="this.classList.add('ok')">
    ${m.rating ? `<span class="badge">★ ${m.rating.toFixed(1)}</span>` : ''}</div>
    <h3>${esc(m.title)}</h3>${p ? `<small>Cap. ${esc(p.chNum)} · pág. ${p.page}</small>` : ''}</button>`;
}
const skeleton = n => Array.from({ length: n }, () => '<div class="skel"></div>').join('');
const errBox = fn => `<div class="msg">Não foi possível carregar os dados. Verifique sua conexão.<br><button onclick="${fn}">Tentar novamente</button></div>`;

/* ---------- Página inicial ---------- */
const SECTIONS = [
  ['🔥 Em alta', 'order[followedCount]=desc&limit=20'],
  ['⭐ Mais bem avaliados', 'order[rating]=desc&limit=20'],
  ['🆕 Atualizados recentemente', 'order[latestUploadedChapter]=desc&limit=20']
];
const GEN_PT = { Action: 'Ação', Adventure: 'Aventura', Comedy: 'Comédia', Drama: 'Drama', Fantasy: 'Fantasia', Horror: 'Terror', Mystery: 'Mistério', Romance: 'Romance', 'Sci-Fi': 'Ficção científica', 'Slice of Life': 'Cotidiano', Sports: 'Esportes', Psychological: 'Psicológico', Supernatural: 'Sobrenatural', Historical: 'Histórico', Thriller: 'Suspense', Tragedy: 'Tragédia', Isekai: 'Isekai', Mecha: 'Mecha', Music: 'Música', Magic: 'Magia', Crime: 'Crime', Superhero: 'Super-herói' };

async function home() {
  const m = $('#main');
  const prog = Object.values(store.get('progress', {})).sort((a, b) => b.ts - a.ts);
  m.innerHTML = (prog.length ? `<h2>📖 Continuar lendo</h2><div class="row">${prog.map(p => {
    cache[p.id] = cache[p.id] || p.manga; return `<button class="card" data-id="${p.id}"><div class="cover"><img src="${esc(p.manga.cover)}" alt="" class="ok" loading="lazy"><div class="bar" style="width:${Math.min(100, p.page / p.total * 100)}%"></div></div><h3>${esc(p.manga.title)}</h3><small>Cap. ${esc(p.chNum)} · pág. ${p.page}/${p.total}</small></button>`; }).join('')}</div>` : '') +
    `<h2>Gêneros</h2><div class="chips" id="genres"></div>` +
    SECTIONS.map((s, i) => `<h2>${s[0]}</h2><div class="row" id="sec${i}">${skeleton(8)}</div>`).join('');
  loadGenres();
  SECTIONS.forEach(async (s, i) => {
    const box = $('#sec' + i);
    try { const { items } = await list(s[1]); box.innerHTML = items.map(card).join(''); }
    catch { box.innerHTML = errBox('home()'); }
  });
}
async function loadGenres() {
  try {
    const d = await api(`${MD}/manga/tag`);
    const g = d.data.filter(t => t.attributes.group === 'genre').sort((a, b) => a.attributes.name.en.localeCompare(b.attributes.name.en));
    $('#genres').innerHTML = g.map(t => `<button class="chip" data-tag="${t.id}" data-n="${esc(GEN_PT[t.attributes.name.en] || t.attributes.name.en)}">${esc(GEN_PT[t.attributes.name.en] || t.attributes.name.en)}</button>`).join('');
  } catch { $('#genres').innerHTML = '<span class="msg">Gêneros indisponíveis.</span>'; }
}

/* ---------- Grade paginada (busca / gênero) ---------- */
async function gridView(title, extra) {
  const m = $('#main'); let off = 0;
  m.innerHTML = `<h2>${title}</h2><div class="grid" id="g">${skeleton(12)}</div><div id="mm"></div>`;
  const load = async () => {
    try {
      const { items, total } = await list(`${extra}&limit=24&offset=${off}`);
      const g = $('#g'); if (!off) g.innerHTML = '';
      if (!items.length && !off) { g.innerHTML = '<div class="msg">Nenhum mangá encontrado.</div>'; return; }
      g.insertAdjacentHTML('beforeend', items.map(card).join(''));
      off += 24; $('#mm').innerHTML = off < total ? '<button class="more">Carregar mais</button>' : '';
      $('#mm .more')?.addEventListener('click', e => { e.target.textContent = 'Carregando…'; load(); });
    } catch { $('#g').innerHTML = errBox('location.reload()'); }
  };
  load();
}

/* ---------- Busca em tempo real (debounce) ---------- */
let tmr;
$('#q').addEventListener('input', e => {
  clearTimeout(tmr);
  const v = e.target.value.trim();
  tmr = setTimeout(() => v.length < 2 ? home() : gridView(`Resultados para “${esc(v)}”`, `title=${encodeURIComponent(v)}&order[relevance]=desc`), 450);
});

/* ---------- Delegação de cliques ---------- */
document.addEventListener('click', e => {
  const c = e.target.closest('.card'); if (c) return openModal(c.dataset.id);
  const t = e.target.closest('.chip');
  if (t) { document.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); t.classList.add('on'); gridView('Gênero: ' + esc(t.dataset.n), `includedTags[]=${t.dataset.tag}&order[followedCount]=desc`); }
  if (e.target.closest('.logo')) { $('#q').value = ''; home(); }
});

/* ---------- Modal de detalhes ---------- */
const LANGS = { ja: '🇯🇵 Japão', ko: '🇰🇷 Coreia do Sul', zh: '🇨🇳 China', 'zh-hk': '🇭🇰 Hong Kong', en: '🇺🇸 EUA/Reino Unido' };
const STATUS = { ongoing: 'Em andamento', completed: 'Completo', hiatus: 'Em hiato', cancelled: 'Cancelado' };
const fact = (k, v, id = '') => `<div class="fact"><small>${k}</small><b ${id ? `id="${id}"` : ''}>${v}</b></div>`;

async function openModal(id) {
  const m = cache[id]; if (!m) return;
  const prog = store.get('progress', {})[id];
  $('#modal').innerHTML = `<button class="x" onclick="closeModal()" aria-label="Fechar">✕</button>
    <div class="cover"><img class="ok" alt="" src="${m.cover}"></div>
    <div><h1>${esc(m.title)}</h1><div class="alt">${esc(m.alts.slice(0, 3).join(' · '))}</div>
    <div class="facts">
      ${fact('Nota dos usuários', m.rating ? '★ ' + m.rating.toFixed(2) + ' / 10' : '—', 'fRate')}
      ${fact('Formato', m.tags.includes('Full Color') ? '🎨 Colorido' : '⬛ Preto e branco')}
      ${fact('País de origem', LANGS[m.lang] || esc(m.lang))}
      ${fact('Autor(es)', esc(m.authors.join(', ') || '—'))}
      ${fact('Arte', esc(m.artists.join(', ') || '—'))}
      ${fact('Revista / Editora', '…', 'fMag')}
      ${fact('Ano de criação', m.year || '—')}
      ${fact('Publicação', STATUS[m.status] || '—', 'fPub')}
      ${fact('Capítulos', '…', 'fCh')}
      ${fact('Adaptação em anime', '…', 'fAnime')}
    </div>
    <div class="tags">${m.tags.slice(0, 8).map(t => `<span>${esc(GEN_PT[t] || t)}</span>`).join('')}</div>
    <div class="desc">${esc(m.desc || 'Sem sinopse disponível.')}</div>
    <button class="btn" id="readBtn" disabled>Carregando capítulos…</button>
    <div class="chlist" id="chl"></div></div>`;
  $('#ov').classList.add('open');
  document.body.style.overflow = 'hidden';

  // Capítulos (PT-BR com fallback para inglês)
  loadChapters(m).then(chs => {
    $('#fCh').textContent = chs.length ? chs.length : '0';
    const b = $('#readBtn');
    if (!chs.length) { b.textContent = 'Sem capítulos disponíveis'; return; }
    const pi = prog ? Math.max(0, chs.findIndex(c => c.id === prog.chId)) : 0;
    b.disabled = false;
    b.textContent = prog ? `▶ Continuar · Cap. ${chs[pi].num}, pág. ${prog.page}` : '▶ Começar a ler';
    b.onclick = () => openReader(m, chs, pi, prog ? prog.page : 1);
    $('#chl').innerHTML = chs.map((c, i) => `<button class="${prog && i === pi ? 'cur' : ''}" data-i="${i}">Cap. ${esc(c.num)}</button>`).join('');
    $('#chl').onclick = e => { const x = e.target.closest('button'); if (x) openReader(m, chs, +x.dataset.i, 1); };
  }).catch(() => { $('#readBtn').textContent = 'Erro ao carregar capítulos'; });
  extra(m); // Jikan: revista, anime
}
function closeModal() { $('#ov').classList.remove('open'); document.body.style.overflow = ''; }
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov') closeModal(); });

/* Metadados extras via Jikan (MyAnimeList) */
async function extra(m) {
  const set = (id, v) => { const el = $('#' + id); if (el) el.textContent = v; };
  try {
    let mal = m.links.mal;
    if (!mal) { const s = await api(`${JK}/manga?q=${encodeURIComponent(m.title)}&limit=1`, 1); mal = s.data[0]?.mal_id; }
    if (!mal) throw 0;
    const { data } = await api(`${JK}/manga/${mal}/full`, 1);
    set('fMag', data.serializations?.map(s => s.name).join(', ') || 'Não informado');
    if (!m.year && data.published?.prop?.from?.year) set('fPub', data.published.prop.from.year);
    if (data.score && !m.rating) set('fRate', '★ ' + data.score + ' / 10 (MAL)');
    const ad = data.relations?.flatMap(r => r.relation === 'Adaptation' ? r.entry : []).find(e => e.type === 'anime');
    if (!ad) return set('fAnime', 'Não');
    set('fAnime', 'Sim');
    await new Promise(r => setTimeout(r, 400)); // respeita limite da Jikan
    const an = await api(`${JK}/anime/${ad.mal_id}`, 1);
    const st = an.data.studios?.map(s => s.name).join(', ');
    set('fAnime', 'Sim' + (st ? ' · ' + st : ''));
  } catch { set('fMag', 'Não informado'); set('fAnime', 'Sem dados'); }
}

/* ---------- Capítulos ---------- */
async function loadChapters(m) {
  for (const lang of ['pt-br', 'en']) {
    const out = []; let off = 0, total = 1;
    while (off < total && off < 3000) {
      const d = await api(`${MD}/manga/${m.id}/feed?translatedLanguage[]=${lang}&order[chapter]=asc&limit=500&offset=${off}&includeExternalUrl=0&contentRating[]=safe&contentRating[]=suggestive`);
      total = d.total; off += 500;
      d.data.forEach(c => c.attributes.pages > 0 && out.push({ id: c.id, num: c.attributes.chapter || 'Oneshot', title: c.attributes.title, lang }));
    }
    const seen = new Set(), chs = out.filter(c => !seen.has(c.num) && seen.add(c.num)); // remove duplicatas de grupos
    if (chs.length) return chs;
  }
  return [];
}

/* ---------- Leitor ---------- */
const S = Object.assign({ font: 'Georgia,serif', size: 16, color: '#eeeeee', bg: '#000000', dir: 'h', q: 'data-saver' }, store.get('settings', {}));
const R = { m: null, chs: [], i: 0, pages: [], p: 1, io: null };

function applySettings() {
  const r = $('#reader').style;
  r.setProperty('--rbg', S.bg); r.setProperty('--rfg', S.color); r.setProperty('--rfont', S.font); r.setProperty('--rsize', S.size + 'px');
  $('#sFont').value = S.font; $('#sSize').value = S.size; $('#sColor').value = S.color;
  document.querySelectorAll('#sDir button').forEach(b => b.classList.toggle('on', b.dataset.d === S.dir));
  document.querySelectorAll('#sQ button').forEach(b => b.classList.toggle('on', b.dataset.q === S.q));
  store.set('settings', S);
}
async function openReader(m, chs, i, page = 1) {
  closeModal();
  Object.assign(R, { m, chs, i });
  $('#reader').classList.add('open'); document.body.style.overflow = 'hidden';
  $('#rTitle').textContent = m.title;
  $('#rChap').innerHTML = chs.map((c, k) => `<option value="${k}">Cap. ${esc(c.num)}</option>`).join('');
  applySettings(); loadChapterPages(page);
}
async function loadChapterPages(page = 1) {
  const st = $('#stage'); $('#rChap').value = R.i;
  st.className = S.dir; st.innerHTML = '<div class="msg">Carregando páginas…</div>';
  try {
    const d = await api(`${MD}/at-home/server/${R.chs[R.i].id}`);
    const c = d.chapter, files = S.q === 'data' ? c.data : c.dataSaver;
    R.pages = files.map(f => img(`${d.baseUrl}/${S.q}/${c.hash}/${f}`));
    R.p = Math.min(Math.max(1, page), R.pages.length);
    renderPages();
  } catch { st.innerHTML = errBox('loadChapterPages()'); }
}
function renderPages() {
  const st = $('#stage'); st.className = S.dir; R.io?.disconnect();
  if (S.dir === 'h') { // estilo Kindle: página por página
    st.innerHTML = '<div class="zone l"></div><div class="zone c"></div><div class="zone r"></div><img alt="">';
    st.querySelector('.l').onclick = () => go(-1); st.querySelector('.r').onclick = () => go(1);
    st.querySelector('.c').onclick = () => $('#rbar').classList.toggle('hide');
    showPage();
  } else { // webtoon: rolagem infinita com lazy loading
    st.innerHTML = R.pages.map((u, k) => `<img loading="lazy" data-p="${k + 1}" src="${u}" alt="Página ${k + 1}">`).join('') +
      `<button class="more" id="nextCh">Próximo capítulo →</button>`;
    $('#nextCh').onclick = () => changeCh(1);
    R.io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { R.p = +e.target.dataset.p; save(); hud(); } }), { root: st, threshold: .5 });
    st.querySelectorAll('img').forEach(i => R.io.observe(i));
    st.querySelector(`img[data-p="${R.p}"]`)?.scrollIntoView();
    st.scrollTop += 0;
  }
  hud(); save();
}
function showPage() {
  const img = $('#stage img'); if (!img) return;
  img.style.opacity = .3; img.src = R.pages[R.p - 1]; img.onload = () => img.style.opacity = 1;
  [1, 2].forEach(n => { if (R.pages[R.p - 1 + n]) new Image().src = R.pages[R.p - 1 + n]; }); // pré-carrega
  hud(); save();
}
function go(d) {
  if (S.dir === 'v') return $('#stage').scrollBy({ top: d * innerHeight * .85, behavior: 'smooth' });
  const n = R.p + d;
  if (n < 1) return changeCh(-1, true);
  if (n > R.pages.length) return changeCh(1);
  R.p = n; showPage();
}
function changeCh(d, last) {
  const n = R.i + d; if (n < 0 || n >= R.chs.length) return;
  R.i = n; loadChapterPages(last ? 9999 : 1);
}
const hud = () => $('#hud').textContent = `Cap. ${R.chs[R.i]?.num} · Página ${R.p} / ${R.pages.length}`;
let svT;
function save() { // salva progresso (manga, capítulo, página) no localStorage
  clearTimeout(svT);
  svT = setTimeout(() => {
    const p = store.get('progress', {});
    p[R.m.id] = { id: R.m.id, manga: { id: R.m.id, title: R.m.title, cover: R.m.cover, alts: R.m.alts, desc: R.m.desc, year: R.m.year, lang: R.m.lang, status: R.m.status, tags: R.m.tags, links: R.m.links, authors: R.m.authors, artists: R.m.artists, rating: R.m.rating },
      chId: R.chs[R.i].id, chNum: R.chs[R.i].num, page: R.p, total: R.pages.length, ts: Date.now() };
    store.set('progress', p);
  }, 250);
}
function closeReader() { R.io?.disconnect(); $('#reader').classList.remove('open'); $('#panel').classList.remove('open'); document.body.style.overflow = ''; home(); }

/* Controles do leitor */
$('#rBack').onclick = closeReader;
$('#rSet').onclick = () => $('#panel').classList.toggle('open');
$('#rChap').onchange = e => { R.i = +e.target.value; loadChapterPages(1); };
$('#sFont').onchange = e => { S.font = e.target.value; applySettings(); };
$('#sSize').oninput = e => { S.size = +e.target.value; applySettings(); };
$('#sColor').oninput = e => { S.color = e.target.value; applySettings(); };
$('#sBg').onclick = e => { const b = e.target.closest('button'); if (b) { S.bg = b.dataset.c; applySettings(); } };
$('#sDir').onclick = e => { const b = e.target.closest('button'); if (b) { S.dir = b.dataset.d; applySettings(); renderPages(); } };
$('#sQ').onclick = e => { const b = e.target.closest('button'); if (b) { S.q = b.dataset.q; applySettings(); loadChapterPages(R.p); } };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') return $('#reader').classList.contains('open') ? closeReader() : closeModal();
  if (!$('#reader').classList.contains('open') || S.dir === 'v') return;
  if (['ArrowRight', ' '].includes(e.key)) go(1);
  if (e.key === 'ArrowLeft') go(-1);
});

/* ---------- Tema claro / escuro ---------- */
function setTheme(t) { document.documentElement.dataset.theme = t; $('#themeBtn').textContent = t === 'dark' ? '🌙' : '☀️'; store.set('theme', t); }
$('#themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
setTheme(store.get('theme', 'dark'));

home();
</script>
</body>
